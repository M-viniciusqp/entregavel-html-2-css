
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Meu Blog</h1>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#artigos">Artigos</a>
            <a href="#inscricao">Inscrição</a>
        </nav>
    </header>

    <main id="artigos">

        <article>
            <h2>Aprendendo HTML</h2>

            <p>
                HTML é utilizado para criar a estrutura das páginas da internet.
            </p>

            <img src="html.jpeg" alt="Imagem sobre HTML">
        </article>

        <article>
            <h2>Tecnologia na Web</h2>

            <p>
                A tecnologia web permite criar sites e aplicações cada vez mais interativas.
            </p>

            <img src="web.jpeg" alt="Imagem sobre tecnologia">
        </article>

    </main>

    <aside id="inscricao">

        <h2>Inscreva-se no blog</h2>

        <form action="" method="get">

            <div class="linha">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" minlength="3" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" name="idade" min="18" max="120" required>
                </div>

            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="assunto">Assunto</label>

                <select id="assunto" name="assunto" required>
                    <option value="" selected disabled>
                        Escolha um assunto
                    </option>

                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </div>

            <label class="termos" for="termos">
                <input type="checkbox" id="termos" name="termos" value="aceito" required>
                Aceito os termos.
            </label>

            <button type="submit">Enviar inscrição</button>

        </form>

    </aside>

    <footer>
        <p>Todos os campos são obrigatórios.</p>
    </footer>

</body>

</html>
